<div class="container">
	<div *ngIf="toastVisible" class="toast align-items-center text-white border-0 show" role="alert" aria-live="assertive" aria-atomic="true" [ngClass]="{'bg-primary': toastVariant==='primary','bg-success': toastVariant==='success','bg-danger': toastVariant==='danger'}" style="position:fixed; top:1rem; right:1rem; z-index:2000;">
		<div class="d-flex">
			<div class="toast-body">
				{{ toastMessage }}
			</div>
			<button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close" (click)="hideToast()"></button>
		</div>
	</div>
	<div class="card">
		<div class="card-body">
			<h1 class="h4 card-title mb-4">Modificar usuario</h1>

			<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
				<div class="mb-3">
					<label for="name" class="form-label">Nombre <span class="text-danger">*</span></label>
					<input id="name" class="form-control" type="text" formControlName="name" required />
					<div class="invalid-feedback d-block" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">El nombre es obligatorio.</div>
				</div>

				<div class="mb-3">
					<label for="lastName" class="form-label">Apellidos </label>
					<input id="lastName" class="form-control" type="text" formControlName="lastName" required />
				</div>

				<div class="mb-3">
					<label for="email" class="form-label">Email <span class="text-danger">*</span></label>
					<input id="email" class="form-control" type="email" formControlName="email" required />
					<div class="invalid-feedback d-block" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">El email es obligatorio y debe ser válido.</div>
				</div>

				<div class="mb-3">
					<label for="phoneNumber" class="form-label">Teléfono <span class="text-danger">*</span></label>
					<input id="phoneNumber" class="form-control" type="text" formControlName="phoneNumber" />
          <div class="invalid-feedback d-block" *ngIf="form.get('phoneNumber')?.touched && form.get('phoneNumber')?.invalid">El teléfono es obligatorio.</div>
				</div>

				<div class="mb-3" *ngIf="canEditRole; else roleReadOnly">
					<label for="role" class="form-label">Rol</label>
					<select id="role" class="form-select" formControlName="role">
						<option *ngFor="let role of roleOptions" [value]="role">{{ role }}</option>
					</select>
				</div>
				<ng-template #roleReadOnly>
					<div class="mb-3">
						<label class="form-label">Rol</label>
						<input class="form-control" type="text" [value]="currentRole" disabled />
					</div>
				</ng-template>

				<div class="mb-3">
					<label for="birthDate" class="form-label">Fecha de nacimiento</label>
					<input id="birthDate" class="form-control" type="date" formControlName="birthDate" />
				</div>

				<p class="mb-3"><small class="text-muted">Campos obligatorios <span class="text-danger">*</span></small></p>

				<div class="d-flex align-items-center gap-2">
					<button class="btn btn-secondary" type="button" (click)="router.navigate(['/users/list'])">Cancelar</button>
					<button class="btn btn-primary" type="submit" [disabled]="loading || form.invalid">{{ loading ? 'Guardando...' : 'Guardar cambios' }}</button>
				</div>

				<div class="mt-3 text-danger" *ngIf="error">{{ error }}</div>
			</form>
		</div>
	</div>
</div>
