<div class="container mt-4">
	<h4>Detalle categoría</h4>
	<div *ngIf="loading" class="alert alert-info">Cargando categoría...</div>
	<div *ngIf="error" class="alert alert-danger">{{ error }}</div>
	<div *ngIf="category" class="card mx-auto p-4" style="max-width: 600px;">
		<div class="row align-items-center">
			<div class="col-12">
				<div class="d-flex align-items-center mb-2">
					<h5 class="mb-0 me-2">{{ category.name }}</h5>
				</div>
				<span class="text-muted small"> Id: {{ category.id }}</span>
				<ul class="list-group list-group-flush mb-2">
					  <li class="list-group-item px-0 py-1"><strong>Descripción:</strong> {{ category.description || '-' }}</li>
				</ul>
			</div>
		</div>
	</div>
</div>
