<div class="container">
  <div class="row mb-4">
    <div class="col">
      <h2 class="fw-bold">Nuevo inventario</h2>
      <p class="text-muted">Modifica el stock de los productos</p>
    </div>
  </div>
 
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Producto</th>
              <th class="text-center">Stock actual</th>
              <th class="text-center">Nuevo stock</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let producto of productos">
              <td>
                <strong>{{ producto.name }}</strong>
                <div class="small text-muted">
                  {{ producto.categoryName || 'Sin categoría' }}
                </div>
              </td>
              <td class="text-center">
                <span>{{ producto.stockOriginal }}</span>
              </td>
              <td class="text-center">
                <div class="d-inline-flex align-items-center gap-2">
                  <button class="btn btn-outline-danger btn-sm" (click)="disminuir(producto)"
                    [disabled]="producto.cantidad <= 0"> &minus;
                  </button>
                  <input type="number" class="form-control form-control-sm text-center" style="width: 80px;"
                    [(ngModel)]="producto.cantidad" min="0" />
                  <button class="btn btn-outline-success btn-sm" (click)="aumentar(producto)"> +
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="productos.length === 0">
              <td colspan="3" class="text-center py-4 text-muted">
                No hay productos disponibles
              </td>
            </tr>

          </tbody>

        </table>
      </div>

    </div>
  </div>

  <div class="d-flex align-items-center gap-2 mt-3">
    <button class="btn btn-secondary" type="button" (click)="router.navigate(['/inventory/list'])">Cancelar</button>
    <button class="btn btn-primary" type="button" (click)="guardarInventario()" [disabled]="loading">{{ loading ? 'Guardando...' : 'Guardar' }}</button>
  </div>

  <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080;">
    <div *ngIf="toastVisible" class="toast show align-items-center border-0 text-bg-{{toastVariant}}" role="alert"
      aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          {{ toastMessage }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close" (click)="hideToast()"></button>
      </div>
    </div>
   </div>

</div>
