<div class="container">
	<div *ngIf="toastVisible" class="toast align-items-center text-white border-0 show" role="alert" aria-live="assertive" aria-atomic="true" [ngClass]="{'bg-primary': toastVariant==='primary','bg-success': toastVariant==='success','bg-danger': toastVariant==='danger'}" style="position:fixed; top:1rem; right:1rem; z-index:2000;">
		<div class="d-flex">
			<div class="toast-body">
				{{ toastMessage }}
			</div>
			<button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close" (click)="hideToast()"></button>
		</div>
	</div>
	<div class="card">
		<div class="card-body">
			<h4 class="card-title mb-4">Modificar producto</h4>

			<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
				<div class="mb-3">
					<label for="name" class="form-label">Nombre <span class="text-danger">*</span></label>
					<input id="name" class="form-control" type="text" formControlName="name" required />
					<div class="invalid-feedback d-block" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">El nombre es obligatorio.</div>
				</div>

				<div class="mb-3">
					<label for="description" class="form-label">Descripción <span class="text-danger">*</span></label>
					<textarea id="description" class="form-control" rows="3" formControlName="description" required></textarea>
					<div class="invalid-feedback d-block" *ngIf="form.get('description')?.touched && form.get('description')?.invalid">La descripción es obligatoria.</div>
				</div>

				<div class="mb-3">
					<label for="size" class="form-label">Talla <span class="text-danger">*</span></label>
					<input id="size" class="form-control" type="text" formControlName="size" required />
					<div class="invalid-feedback d-block" *ngIf="form.get('size')?.touched && form.get('size')?.invalid">La talla es obligatoria.</div>
				</div>

				<div class="row">
					<div class="col-md-6 mb-3">
						<label for="price" class="form-label">Precio (€) <span class="text-danger">*</span></label>
						<input id="price" class="form-control" type="number" step="0.01" formControlName="price" required />
						<div class="invalid-feedback d-block" *ngIf="form.get('price')?.touched && form.get('price')?.invalid">Precio inválido.</div>
					</div>
					<div class="col-md-6 mb-3">
						<label for="stock" class="form-label">Stock <span class="text-danger">*</span></label>
						<input id="stock" class="form-control" type="number" formControlName="stock" required />
						<div class="invalid-feedback d-block" *ngIf="form.get('stock')?.touched && form.get('stock')?.invalid">Stock inválido.</div>
					</div>
				</div>

				<div class="mb-3">
					<label for="category" class="form-label">Categoría <span class="text-danger">*</span></label>
					<select id="category" class="form-select" formControlName="categoryId" required>
						<option [ngValue]="null">-- Seleccione --</option>
						<option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
					</select>
					<div class="invalid-feedback d-block" *ngIf="form.get('categoryId')?.touched && form.get('categoryId')?.invalid">Seleccione una categoría.</div>
				</div>

				<p class="mb-3"><small class="text-muted">Campos obligatorios <span class="text-danger">*</span></small></p>

				<div class="mb-3">
					<label for="image" class="form-label">Imagen actual</label>
					<div class="mb-2" *ngIf="imageUrl || productImageUrl">
						<img [src]="imageUrl || productImageUrl" class="img-fluid" style="max-height: 120px; border-radius: 8px;" />
					</div>
					<input id="image" type="file" class="form-control form-control-sm w-auto" (change)="onFileSelected($event)" accept="image/*" />
				</div>

				<div class="d-flex align-items-center gap-2">
					<button class="btn btn-secondary" type="button" (click)="router.navigate(['/products/list'])">Cancelar</button>
					<button class="btn btn-primary" type="submit" [disabled]="loading || form.invalid">{{ loading ? 'Guardando...' : 'Guardar cambios' }}</button>
				</div>

				<div class="mt-3 text-danger" *ngIf="error">{{ error }}</div>
			</form>
		</div>
	</div>
</div>
