<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6">
      <h3>Registrate</h3>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" formControlName="name"
            [class.is-invalid]="form.get('name')?.touched && form.get('name')?.invalid">
          <div *ngIf="form.get('name')?.touched && form.get('name')?.invalid" class="invalid-feedback">El nombre es
            obligatorio.</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Apellidos</label>
          <input class="form-control" formControlName="lastName">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" formControlName="email"
            [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid">
          <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="invalid-feedback">Introduce un
            email válido.</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input class="form-control" formControlName="phoneNumber"
            [class.is-invalid]="form.get('phoneNumber')?.touched && form.get('phoneNumber')?.invalid">
          <div *ngIf="form.get('phoneNumber')?.touched && form.get('phoneNumber')?.invalid" class="invalid-feedback">El
            teléfono es obligatorio.</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" formControlName="password"
            [class.is-invalid]="form.get('password')?.touched && form.get('password')?.invalid">
          <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="invalid-feedback">La
            contraseña debe tener al menos 6 caracteres.</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Repetir contraseña</label>
          <input type="password" class="form-control" formControlName="confirmPassword"
            [class.is-invalid]="form.get('confirmPassword')?.touched && form.get('confirmPassword')?.invalid">
          <div *ngIf="form.get('confirmPassword')?.touched && form.get('confirmPassword')?.hasError('required')"
            class="invalid-feedback">Debes repetir la contraseña.</div>
          <div *ngIf="form.get('confirmPassword')?.touched && form.get('confirmPassword')?.hasError('mismatch')"
            class="invalid-feedback">Las contraseñas no coinciden.</div>
        </div>

        <button class="btn btn-secondary ms-2" type="button" (click)="goToLogin()">Accede</button>
        <button class="btn btn-primary ms-2" type="submit" [disabled]="submitting">{{ submitting ? 'Registrando...' : 'Registrate' }}</button>
      </form>
    </div>
  </div>
</div>

<div class="position-fixed top-0 end-0 p-3" style="z-index: 1080;">
  <div *ngIf="toastVisible" class="toast show align-items-center border-0 text-bg-{{toastVariant}}" role="alert"
    aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        {{ toastMessage }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close"
        (click)="hideToast()"></button>
    </div>
  </div>
</div>
