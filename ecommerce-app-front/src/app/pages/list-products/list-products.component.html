<div class="list-products container-fluid">
  <h6 class="mb-3">Listado de productos</h6>

  <div *ngIf="loading" class="mb-3">Cargando...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  
  <ng-container *ngIf="!loading && products?.length; else noData">
    <div class="table-header d-none d-md-flex fw-bold small px-2">
      <div class="col-1">ID</div>
      <div class="col">Nombre</div>
      <div class="col-2">Descripción</div>
      <div class="col-2">Stock</div>
      <div class="col-2 text-end">Acciones</div>
    </div>
    <div *ngFor="let p of products" class="product-row d-flex align-items-center my-2">
      <div class="col-1 small px-2">{{ p.id }}</div>
      <div class="col small px-2">{{ p.name }}</div>
      <div class="col-2 small px-2">{{ p.description }}</div>
      <div class="col-2 small px-2">{{p.stock }}</div>
      <div class="col-2 text-end px-2">
        <button class="btn btn-sm btn-outline-secondary me-1" (click)="view(p.id)" title="Ver">
          <i class="bi bi-eye"></i>
        </button>
        <button class="btn btn-sm btn-outline-secondary me-1" (click)="edit(p.id)" title="Editar">
          <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-outline-danger" (click)="delete(p.id)" title="Eliminar">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
  </ng-container>

  <ng-template #noData>
    <div *ngIf="!loading" class="mt-3 text-muted">No hay productos.</div>
  </ng-template>
</div>
