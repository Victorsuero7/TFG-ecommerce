
<div class="bg-light w-100" style="position:relative; min-height:100vh;">
  <div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2;">
    <div class="card shadow-lg p-4" style="min-width:370px; max-width:480px; border-radius: 1.5rem;">
    <div class="text-center mb-4">
      <i class="bi bi-box-seam fs-1 text-primary mb-2"></i>
      <h4 class="fw-bold">Accede</h4>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" formControlName="email"
          [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid">
        <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="invalid-feedback">Introduce un email válido.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" formControlName="password"
          [class.is-invalid]="form.get('password')?.touched && form.get('password')?.invalid">
        <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="invalid-feedback">La contraseña es obligatoria.</div>
      </div>
      <div class="d-flex justify-content-between">
        <button class="btn btn-outline-primary" type="button" (click)="goToRegister()"><i class="bi bi-person-plus me-1"></i>Registrate</button>
        <button class="btn btn-primary" type="submit" [disabled]="submitting">{{ submitting ? 'Accediendo...' : 'Accede' }}</button>
      </div>
    </form>
  </div>

</div>

<div class="position-fixed top-0 end-0 p-3" style="z-index: 3000;">
  <div *ngIf="toastVisible" class="toast show align-items-center border-0 text-bg-{{toastVariant}}" role="alert"
    aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        {{ toastMessage }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close"
        (click)="hideToast()"></button>
    </div>
  </div>
</div>
</div>
